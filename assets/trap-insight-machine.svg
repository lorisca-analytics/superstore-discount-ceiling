<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- TRAP -->
  <rect x="20" y="20" width="260" height="260" rx="10" fill="#FDECEA" stroke="#E5A49E"/>
  <text x="40" y="52" font-size="13" font-weight="bold" fill="#B3261E" letter-spacing="2">THE TRAP</text>
  <text x="40" y="86" font-size="20" font-weight="bold" fill="#222">Budget follows</text>
  <text x="40" y="112" font-size="20" font-weight="bold" fill="#222">sales volume</text>
  <text x="40" y="148" font-size="13" fill="#555">Phones sells $330K. Chairs $328K.</text>
  <text x="40" y="168" font-size="13" fill="#555">Tables is #4. So the ad money</text>
  <text x="40" y="188" font-size="13" fill="#555">goes to the biggest sellers —</text>
  <text x="40" y="208" font-size="13" fill="#555">including one that loses money.</text>
  <text x="40" y="248" font-size="12" font-style="italic" fill="#B3261E">The obvious metric points one way.</text>

  <line x1="280" y1="150" x2="318" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- INSIGHT -->
  <rect x="320" y="20" width="260" height="260" rx="10" fill="#E8F0FE" stroke="#A8C0E8"/>
  <text x="340" y="52" font-size="13" font-weight="bold" fill="#1A56DB" letter-spacing="2">THE INSIGHT</text>
  <text x="340" y="86" font-size="20" font-weight="bold" fill="#222">The 20% discount</text>
  <text x="340" y="112" font-size="20" font-weight="bold" fill="#222">ceiling</text>
  <text x="340" y="148" font-size="13" fill="#555">No discount level above 20%</text>
  <text x="340" y="168" font-size="13" fill="#555">makes money. At or below 20%:</text>
  <text x="340" y="188" font-size="13" fill="#555">+$422K profit. Above: −$135K.</text>
  <text x="340" y="208" font-size="13" fill="#555">States confirm it (r = −0.98).</text>
  <text x="340" y="248" font-size="12" font-style="italic" fill="#1A56DB">The mechanism points the other.</text>

  <line x1="580" y1="150" x2="618" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MACHINE -->
  <rect x="620" y="20" width="260" height="260" rx="10" fill="#E6F4EA" stroke="#A3D2B4"/>
  <text x="640" y="52" font-size="13" font-weight="bold" fill="#137333" letter-spacing="2">THE MACHINE</text>
  <text x="640" y="86" font-size="20" font-weight="bold" fill="#222">Fund / Fix / Stop</text>
  <text x="640" y="122" font-size="13" fill="#555"><tspan font-weight="bold" fill="#137333">Fund</tspan> Paper · Copiers · Accessories</text>
  <text x="640" y="142" font-size="13" fill="#555"><tspan font-weight="bold" fill="#B26A00">Fix</tspan> pricing on Binders · Storage · Chairs</text>
  <text x="640" y="162" font-size="13" fill="#555"><tspan font-weight="bold" fill="#B3261E">Stop</tspan> Tables · Bookcases · Machines</text>
  <text x="640" y="198" font-size="13" fill="#555">Dashboard with live parameters:</text>
  <text x="640" y="218" font-size="13" fill="#555">drag the ceiling, watch profit</text>
  <text x="640" y="238" font-size="13" fill="#555">move $286K → $422K (+47%).</text>
  <text x="640" y="266" font-size="12" font-style="italic" fill="#137333">The reader tests the recommendation.</text>
</svg>
